version: '3.8'

services:
  # Node.js Express REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-master-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskmaster
      - JWT_SECRET=supersecretjwtkey_taskmaster_production_safe_token_987654321
      - JWT_EXPIRES_IN=7d
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - task-network

  # Official MongoDB Database Service
  mongo:
    image: mongo:6.0
    container_name: task-master-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=taskmaster
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - task-network

# Persistent data volumes
volumes:
  mongo-data:
    driver: local

# Internal bridge network for inter-container communication
networks:
  task-network:
    driver: bridge

